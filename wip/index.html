<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connect 5: War Room (v10.0)</title>
    <style>
        :root {
            /* --- CYBERPUNK PALETTE --- */
            --bg-color: #050a10;
            --panel-bg: rgba(10, 20, 30, 0.95);
            --grid-line: #1a3c5a;
            
            --text-main: #64d2ff;  /* Cyan */
            --text-warn: #ffaa00;  /* Amber */
            --text-crit: #ff3333;  /* Red */
            --text-rare: #d946ef;  /* Magenta */
            --text-dim: #4a5a6a;

            --p1-neon: #00f0ff;
            --p2-neon: #ffaa00;
            --bunker-white: #ffffff;
            --crater-black: #000000;

            --cell-size: clamp(20px, 4vw, 35px); /* Responsive cell size */
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 20, 40, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 20, 40, 0.8) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        #app {
            display: flex;
            flex-direction: row;
            gap: 15px;
            padding: 15px;
            border: 2px solid var(--grid-line);
            background: var(--panel-bg);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
        }

        .panel {
            border: 1px solid var(--grid-line);
            padding: 10px;
            background: rgba(0,0,0,0.3);
            position: relative;
        }

        .panel-title {
            position: absolute;
            top: -8px;
            left: 10px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 0.8rem;
            color: var(--text-dim);
            border: 1px solid var(--grid-line);
        }

        h2 { margin: 5px 0 5px 0; font-size: 1rem; text-align: center; border-bottom: 1px solid var(--grid-line); padding-bottom: 5px; }
        .p1-title { color: var(--p1-neon); text-shadow: 0 0 5px var(--p1-neon); }
        .p2-title { color: var(--p2-neon); text-shadow: 0 0 5px var(--p2-neon); }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 3px; font-size: 0.9rem; }
        
        /* COMMANDS */
        button {
            background: #0a1015;
            color: var(--text-main);
            border: 1px solid var(--grid-line);
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            text-transform: uppercase;
            width: 100%;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        button:hover { background: var(--text-main); color: #000; border-color: var(--text-main); }
        button:active { transform: translateY(1px); }
        button:disabled { border-color: #333; color: #444; cursor: not-allowed; background: #050505; pointer-events: none; }

        /* SPECIAL BUTTONS */
        button.nuke-btn { border-color: var(--text-crit); color: var(--text-crit); }
        button.nuke-btn:hover { background: var(--text-crit); color: #000; }
        button.nuke-btn.active { 
            background: var(--text-crit); color: #000; 
            box-shadow: 0 0 15px var(--text-crit); 
            animation: pulse 1s infinite;
        }
        
        button.craft-btn { border-color: var(--text-rare); color: var(--text-rare); }
        button.craft-btn:hover { background: var(--text-rare); color: #000; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* --- GAME GRID --- */
        #board-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border: 1px solid var(--grid-line);
            padding: 5px;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(15, var(--cell-size));
            grid-template-rows: repeat(15, var(--cell-size));
            gap: 1px;
            background: var(--grid-line);
        }

        .cell {
            background: var(--bg-color);
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.1s;
            position: relative;
        }

        .cell:hover { background: #1a2a3a; }

        /* --- CELL STATES --- */
        .cell.p1 { background: rgba(0, 240, 255, 0.2); box-shadow: inset 0 0 8px var(--p1-neon); }
        .cell.p1::after { content: ''; width: 40%; height: 40%; background: var(--p1-neon); border-radius: 50%; box-shadow: 0 0 10px var(--p1-neon); }

        .cell.p2 { background: rgba(255, 170, 0, 0.2); box-shadow: inset 0 0 8px var(--p2-neon); }
        .cell.p2::after { content: ''; width: 40%; height: 40%; background: var(--p2-neon); transform: rotate(45deg); box-shadow: 0 0 10px var(--p2-neon); }
        
        .cell.p1-scored { background: var(--p1-neon); }
        .cell.p1-scored::after { background: #fff; }
        
        .cell.p2-scored { background: var(--p2-neon); }
        .cell.p2-scored::after { background: #fff; }

        /* Bunker Styles */
        .cell.bunker { border: 2px solid #fff; z-index: 2; }
        .cell.bunker::before { content: "+"; color: #fff; font-weight: 900; font-size: 1.2em; position: absolute; }
        .cell.bunker.p1 { box-shadow: 0 0 10px var(--p1-neon), inset 0 0 5px var(--p1-neon); }
        .cell.bunker.p2 { box-shadow: 0 0 10px var(--p2-neon), inset 0 0 5px var(--p2-neon); }

        /* Destruction */
        .cell.crater { 
            background: #000; 
            background-image: radial-gradient(circle, #200 10%, #000 70%);
            border: 1px dashed #500;
        }
        .cell.crater::after { content: ''; display: none; } /* Hide pieces in crater */

        /* --- OVERLAYS --- */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        .hidden { opacity: 0; pointer-events: none; }

        input {
            background: #080f15; border: 1px solid var(--text-main); 
            color: var(--text-main); padding: 12px; margin-bottom: 15px;
            font-family: inherit; text-align: center; width: 250px;
            font-size: 1.1rem; text-transform: uppercase;
        }
        input:focus { outline: none; border-color: #fff; box-shadow: 0 0 15px var(--text-main); }

        #turn-indicator {
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 1rem;
            background: #050505;
            border: 1px solid var(--grid-line);
            margin-bottom: 10px;
            min-height: 40px;
            display: flex; align-items: center; justify-content: center;
        }

        #logs {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #666;
            border-top: 1px solid var(--grid-line);
            margin-top: 10px;
            padding-top: 5px;
            scrollbar-width: thin;
            scrollbar-color: var(--grid-line) #000;
        }
        .log-msg { margin-bottom: 2px; font-family: monospace; }
        .log-sys { color: var(--text-main); }
        .log-err { color: var(--text-crit); }
        .log-chat { color: #fff; background: rgba(255,255,255,0.1); padding: 1px 3px; }

        /* Responsive Layout */
        @media (max-width: 800px) {
            #app { flex-direction: column-reverse; width: 100%; height: 100%; border: none; }
            #sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; height: auto; min-height: 120px; }
            .panel { flex: 1; min-width: 140px; }
            #logs { display: none; } /* Hide logs on mobile to save space */
            #board-container { flex-grow: 1; border: none; }
            :root { --cell-size: clamp(15px, 8vw, 30px); }
        }

    </style>
</head>
<body>

    <!-- CONNECT OVERLAY -->
    <div id="overlay">
        <h1 style="color:var(--text-warn); text-shadow:0 0 20px var(--text-warn); letter-spacing: 5px;">WAR ROOM</h1>
        <div style="font-size: 0.8rem; color: #888; margin-bottom: 20px;">V10.0 // SECURE UPLINK</div>
        
        <input type="text" id="room-input" placeholder="ENTER ROOM CODE" value="WAR1" maxlength="6">
        <button style="width: 250px; font-size: 1.2rem;" onclick="app.connect()">ESTABLISH LINK</button>
        
        <p id="conn-status" style="color: var(--text-crit); height: 20px; font-size: 0.8rem;"></p>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="app" class="hidden">
        
        <!-- SIDEBAR CONTROLS -->
        <div id="sidebar">
            <div id="turn-indicator">INITIALIZING...</div>
            
            <div class="panel">
                <div class="panel-title">STATUS: P1</div>
                <h2 class="p1-title">PLAYER 1</h2>
                <div class="stat-row"><span>SCORE</span> <span id="p1-score">0</span></div>
                <div class="stat-row"><span>NUKES</span> <span id="p1-nuke">0</span></div>
                <div class="stat-row"><span>BOOST</span> <span id="p1-boost">0</span></div>
                <div class="stat-row"><span>BUNKERS</span> <span id="p1-bunkers">0</span></div>
            </div>

            <div class="panel">
                <div class="panel-title">STATUS: P2</div>
                <h2 class="p2-title">PLAYER 2</h2>
                <div class="stat-row"><span>SCORE</span> <span id="p2-score">0</span></div>
                <div class="stat-row"><span>NUKES</span> <span id="p2-nuke">0</span></div>
                <div class="stat-row"><span>BOOST</span> <span id="p2-boost">0</span></div>
                <div class="stat-row"><span>BUNKERS</span> <span id="p2-bunkers">0</span></div>
            </div>

            <div class="panel" style="flex-grow: 1; display: flex; flex-direction: column;">
                <div class="panel-title">TACTICS</div>
                <button id="btn-nuke" class="nuke-btn" onclick="app.toggleNukeMode()">ARM NUKE</button>
                <button id="btn-craft" class="craft-btn" onclick="app.sendCraft()">CRAFT NUKE (3 BST)</button>
                
                <div id="logs"></div>
                <input type="text" id="chat-input" placeholder="COMMS..." onkeypress="app.handleChat(event)" style="width: 100%; margin: 5px 0 0 0; font-size: 0.8rem;">
            </div>
        </div>

        <!-- GAME BOARD -->
        <div id="board-container">
            <div id="game-board"></div>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        // Automatically switch between ws:// (local) and wss:// (render https)
        const HOST = "ticktack-nuke-server.onrender.com";
        const PROTOCOL = location.protocol === 'https:' ? 'wss' : 'ws';
        const SERVER_URL = `${PROTOCOL}://${HOST}`;
        
        const MAP_SIZE = 15;

        // --- ENUMS (MUST MATCH SERVER) ---
        const STATE = {
            EMPTY: 0,
            P1: 1, P2: 2,
            P1_SCORED: 3, P2_SCORED: 4,
            P1_BUNKER: 5, P2_BUNKER: 6,
            P1_BUNKER_SCORED: 7, P2_BUNKER_SCORED: 8,
            CRATER: 9
        };

        // --- AUDIO ENGINE ---
        const AudioSys = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            play(freq, type, dur, vol = 0.1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + dur);
            },
            click() { this.play(800, 'square', 0.05, 0.05); },
            error() { this.play(150, 'sawtooth', 0.3, 0.1); },
            nuke() { 
                this.play(100, 'sawtooth', 0.8, 0.2); 
                setTimeout(() => this.play(50, 'square', 1.0, 0.2), 100);
            },
            turn() { this.play(600, 'sine', 0.2, 0.1); },
            win() { 
                [400, 500, 600, 800].forEach((f, i) => setTimeout(() => this.play(f, 'square', 0.2, 0.1), i*100));
            }
        };

        // --- MAIN APP LOGIC ---
        class GameClient {
            constructor() {
                this.ws = null;
                this.myRole = null; // 1, 2, or "spectator"
                this.gameState = null;
                this.nukeMode = false;
                
                // Elements cache
                this.els = {
                    board: document.getElementById('game-board'),
                    overlay: document.getElementById('overlay'),
                    status: document.getElementById('conn-status'),
                    app: document.getElementById('app'),
                    turn: document.getElementById('turn-indicator'),
                    btnNuke: document.getElementById('btn-nuke'),
                    logs: document.getElementById('logs'),
                    stats: {
                        1: {
                            score: document.getElementById('p1-score'),
                            nuke: document.getElementById('p1-nuke'),
                            boost: document.getElementById('p1-boost'),
                            bunker: document.getElementById('p1-bunkers')
                        },
                        2: {
                            score: document.getElementById('p2-score'),
                            nuke: document.getElementById('p2-nuke'),
                            boost: document.getElementById('p2-boost'),
                            bunker: document.getElementById('p2-bunkers')
                        }
                    }
                };

                this.initGrid();
            }

            initGrid() {
                this.els.board.innerHTML = '';
                for (let r = 0; r < MAP_SIZE; r++) {
                    for (let c = 0; c < MAP_SIZE; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.r = r;
                        cell.dataset.c = c;
                        // Mobile touch support vs Click
                        cell.addEventListener('mousedown', (e) => this.handleInput(r, c));
                        this.els.board.appendChild(cell);
                    }
                }
            }

            connect() {
                const roomInput = document.getElementById('room-input');
                const roomId = roomInput.value.trim().toUpperCase() || "WAR1";
                
                this.els.status.innerText = "SEARCHING FOR SIGNAL...";
                AudioSys.init();

                try {
                    this.ws = new WebSocket(SERVER_URL);
                } catch (e) {
                    this.els.status.innerText = "INVALID URL CONFIG";
                    return;
                }

                this.ws.onopen = () => {
                    this.els.status.innerText = "UPLINK ESTABLISHED";
                    this.ws.send(JSON.stringify({ type: 'join', room: roomId }));
                };

                this.ws.onmessage = (event) => this.handleMsg(JSON.parse(event.data));
                
                this.ws.onclose = () => {
                    this.els.status.innerText = "SIGNAL LOST - REFRESH";
                    this.log("CONNECTION LOST", true);
                    this.els.overlay.classList.remove('hidden');
                };

                this.ws.onerror = () => {
                    this.els.status.innerText = "CONNECTION FAILED";
                };
            }

            handleMsg(data) {
                switch(data.type) {
                    case 'WELCOME':
                        this.myRole = data.role;
                        this.els.overlay.classList.add('hidden');
                        this.els.app.classList.remove('hidden');
                        this.log(`CONNECTED AS ${this.myRole === 1 ? 'PLAYER 1' : this.myRole === 2 ? 'PLAYER 2' : 'SPECTATOR'}`);
                        break;
                    case 'STATE_UPDATE':
                        this.updateState(data.state);
                        break;
                    case 'ERROR':
                        this.log(data.msg, true);
                        AudioSys.error();
                        break;
                    case 'chat':
                        this.log(`${data.role === 1 ? 'P1' : 'P2'}: ${data.msg}`, false, true);
                        break;
                }
            }

            handleInput(r, c) {
                if (!this.gameState) return;
                
                // Safety check: Don't allow clicks if game over or spectator
                if (!this.gameState.gameActive) return;
                
                // Turn Check (Client side prediction/feedback)
                if (this.gameState.currentPlayer !== this.myRole && !this.gameState.bonusTurn) {
                    // AudioSys.error(); // Optional: Beep on wrong turn
                    return;
                }

                if (this.nukeMode) {
                    const myNukes = this.gameState.nukes[this.myRole];
                    const myBoost = this.gameState.boosters[this.myRole];
                    
                    if (myNukes > 0) {
                        let boosted = false;
                        if (myBoost > 0) {
                            boosted = confirm("DEPLOY MEGA-NUKE? (Consumes 1 Booster)");
                        }
                        
                        this.send({ type: 'NUKE', r, c, boosted });
                        this.toggleNukeMode(); // Disable after shot
                        AudioSys.nuke();
                    } else {
                        this.log("NO NUCLEAR ASSETS");
                        AudioSys.error();
                        this.toggleNukeMode();
                    }
                } else {
                    AudioSys.click();
                    this.send({ type: 'PLACE', r, c });
                }
            }

            send(payload) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(payload));
                }
            }

            // --- GAMEPLAY ACTIONS ---
            toggleNukeMode() {
                this.nukeMode = !this.nukeMode;
                this.els.btnNuke.classList.toggle('active', this.nukeMode);
                this.els.btnNuke.innerText = this.nukeMode ? "SELECT TARGET" : "ARM NUKE";
            }

            sendCraft() {
                const myBoost = this.gameState.boosters[this.myRole];
                if (myBoost >= 3) {
                    this.send({ type: 'CRAFT' });
                } else {
                    this.log("INSUFFICIENT BOOSTERS");
                    AudioSys.error();
                }
            }

            handleChat(e) {
                if (e.key === 'Enter') {
                    const input = document.getElementById('chat-input');
                    const text = input.value.trim();
                    if (text) {
                        this.send({ type: 'chat', msg: text });
                        input.value = '';
                    }
                }
            }

            // --- RENDERER ---
            updateState(state) {
                // Audio Cue for Turn Change
                if (this.gameState && this.gameState.currentPlayer !== state.currentPlayer) {
                    if (state.currentPlayer === this.myRole) AudioSys.turn();
                }
                
                if (state.winner && (!this.gameState || !this.gameState.winner)) {
                    AudioSys.win();
                    this.log(`GAME OVER - PLAYER ${state.winner} WINS!`);
                }

                this.gameState = state;
                this.renderGrid();
                this.renderUI();
            }

            renderGrid() {
                const cells = this.els.board.children;
                for (let r = 0; r < MAP_SIZE; r++) {
                    for (let c = 0; c < MAP_SIZE; c++) {
                        const idx = r * MAP_SIZE + c;
                        const cell = cells[idx];
                        const val = this.gameState.grid[r][c];
                        
                        // Clear classes but keep 'cell'
                        cell.className = 'cell';

                        if (val === STATE.P1) cell.classList.add('p1');
                        if (val === STATE.P2) cell.classList.add('p2');
                        if (val === STATE.P1_SCORED) cell.classList.add('p1-scored');
                        if (val === STATE.P2_SCORED) cell.classList.add('p2-scored');
                        if (val === STATE.P1_BUNKER || val === STATE.P1_BUNKER_SCORED) cell.classList.add('bunker', 'p1');
                        if (val === STATE.P2_BUNKER || val === STATE.P2_BUNKER_SCORED) cell.classList.add('bunker', 'p2');
                        if (val === STATE.CRATER) cell.classList.add('crater');
                    }
                }
            }

            renderUI() {
                // Update Stats
                [1, 2].forEach(p => {
                    this.els.stats[p].score.innerText = this.gameState.scores[p];
                    this.els.stats[p].nuke.innerText = this.gameState.nukes[p];
                    this.els.stats[p].boost.innerText = this.gameState.boosters[p];
                    this.els.stats[p].bunker.innerText = this.gameState.bunkers[p];
                });

                // Update Turn Indicator
                const turnEl = this.els.turn;
                if (this.gameState.winner) {
                    turnEl.innerText = `VICTORY: PLAYER ${this.gameState.winner}`;
                    turnEl.style.color = "#fff";
                    turnEl.style.background = this.gameState.winner === 1 ? 'var(--p1-neon)' : 'var(--p2-neon)';
                } else if (this.gameState.bonusTurn) {
                    turnEl.innerText = `BONUS TURN (P${this.gameState.currentPlayer})`;
                    turnEl.style.color = "var(--text-rare)";
                    turnEl.style.background = "#050505";
                } else {
                    const isMe = this.gameState.currentPlayer === this.myRole;
                    turnEl.innerText = isMe ? "YOUR COMMAND" : `WAITING FOR P${this.gameState.currentPlayer}...`;
                    turnEl.style.color = this.gameState.currentPlayer === 1 ? 'var(--p1-neon)' : 'var(--p2-neon)';
                    turnEl.style.background = "#050505";
                }

                // Button State
                const myRole = this.myRole;
                const isMyTurn = this.gameState.currentPlayer === myRole || (this.gameState.bonusTurn && this.gameState.currentPlayer === myRole);
                const hasNukes = this.gameState.nukes[myRole] > 0;
                const hasBoosts = this.gameState.boosters[myRole] >= 3;

                this.els.btnNuke.disabled = !isMyTurn || !hasNukes;
                document.getElementById('btn-craft').disabled = !isMyTurn || !hasBoosts;
                
                if (!hasNukes && this.nukeMode) this.toggleNukeMode();
            }

            log(msg, isErr = false, isChat = false) {
                const div = document.createElement('div');
                div.className = 'log-msg';
                if (isErr) div.classList.add('log-err');
                else if (isChat) div.classList.add('log-chat');
                else div.classList.add('log-sys');
                
                div.innerText = `> ${msg}`;
                this.els.logs.prepend(div);
                
                if (this.els.logs.children.length > 50) this.els.logs.lastChild.remove();
            }
        }

        // --- START ---
        const app = new GameClient();

    </script>
</body>
</html>
